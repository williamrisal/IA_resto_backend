services:
  backend:
    build: .
    container_name: paneladmin_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://TON_USER_ATLAS:TON_PASSWORD_ATLAS@clusterXXXXX.mongodb.net/NOM_DE_TA_BDD?retryWrites=true&w=majority
      - PORT=5000
      - JWT_SECRET=ton_secret_jwt
      - CLIENT_URL=http://myrestoia.s3-website.eu-north-1.amazonaws.com
    networks:
      - paneladmin-network
    restart: unless-stopped

networks:
  paneladmin-network:
    driver: bridge
